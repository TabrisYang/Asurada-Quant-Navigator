# === 阿斯拉量化系統 — Docker Compose ===

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/backend
      - DATABASE_URL=sqlite:///app/data/asura.db
    volumes:
      - app-data:/app/data
    restart: unless-stopped

