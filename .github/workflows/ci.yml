name: CI

# push 對所有分支觸發（feature 分支平常也有保護）；PR 到 main 會多跑一次，可接受
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Repo health check
        run: python backend/scripts/check_repo_health.py

      - name: Lint
        run: |
          pip install ruff
          ruff check backend/

      - name: Test
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      # 注意：根 tsconfig 是 project references（files: []），必須用 tsc -b；
      # 裸 tsc --noEmit 會 "no inputs" 直接失敗
      - name: Typecheck
        run: cd frontend && npx tsc -b

      - name: Build
        run: cd frontend && npm run build
